[build-system]
requires = ["setuptools>=68,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-studio"
version = "0.1.0"
description = "Пульт для Unitree G1 в Isaac Sim: камера с YOLO, чат с Qwen, ручное управление"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [{ name = "G1 Studio contributors" }]
keywords = ["unitree", "g1", "isaac-sim", "robotics", "yolo", "qwen"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# unitree_sdk2py и cyclonedds ставит scripts/setup_studio.sh (их нет на PyPI в нужном виде).
# opencv — только headless: обычный opencv-python тащит свой Qt и ломает PySide6.
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pyzmq>=25",
    "onnxruntime>=1.17",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
bench = ["mujoco>=3.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
g1-studio = "g1_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
g1_studio = ["isaac/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "bench: интеграционные тесты на MuJoCo-стенде (нужны mujoco и unitree_sdk2py)",
]
addopts = "-m 'not bench'"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501", "B008"]
